
{% extends "base.html" %}

{% block title %}Register - PayFlow{% endblock %}

{% block content %}

<div class="auth-card">

    <h1>Create Account</h1>

    <p class="subtitle">
        Join PayFlow and manage your digital wallet.
    </p>

    <form method="POST">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <label>Full Name</label>

        <input
            type="text"
            name="name"
            placeholder="Enter your name"
            maxlength="100"
            required
        >

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Minimum 8 characters"
            minlength="8"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p class="bottom-text">
        Already have an account?

        <a href="{{ url_for('login') }}">Login</a>
    </p>

</div>

{% endblock %}
